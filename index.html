<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy Card Mailer Sandbox</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f5f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #111; }
        p { color: #666; font-size: 14px; line-height: 1.5; }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0051cb; }
        button:disabled { background-color: #aaf; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; font-weight: 500; text-align: center; }
        .success { color: #00875a; }
        .error { color: #de350b; }
    </style>
</head>
<body>

<div class="card">
    <h2>💳 Test Card Generator</h2>
    <p>Enter an email address to generate structurally valid test card numbers and send them over to an inbox.</p>
    
    <form id="mailerForm">
        <input type="email" id="emailInput" placeholder="your-email@example.com" required>
        <button type="submit" id="submitBtn">Email Dummy Details</button>
    </form>
    
    <div id="status"></div>
</div>

<script>
    document.getElementById('mailerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('emailInput').value;
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        
        statusDiv.className = '';
        statusDiv.innerText = 'Generating data and sending email...';
        submitBtn.disabled = true;
        
        try {
            const response = await fetch('/api/send-card', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            
            const result = await response.json();
            
            if (response.ok) {
                statusDiv.className = 'success';
                statusDiv.innerText = '🚀 Success! Check your inbox.';
            } else {
                statusDiv.className = 'error';
                statusDiv.innerText = `Error: ${result.error || 'Failed to send'}`;
            }
        } catch (err) {
            statusDiv.className = 'error';
            statusDiv.innerText = 'Network error occurred. Try again.';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
